{% extends 'base.html' %}
{% block content %}


<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0"><i class="bi bi-pencil me-2"></i>Editar Evaluación</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="/evaluaciones/{{ ev.id }}/editar" id="formEvaluacion">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Título <span class="text-danger">*</span></label>
                            <input type="text" name="titulo" class="form-control" required value="{{ ev.titulo }}" maxlength="150">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Fecha <span class="text-danger">*</span></label>
                            <input type="date" name="fecha" id="fechaInput" class="form-control" required value="{{ ev.fecha }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Hora</label>
                            <input type="time" name="hora" class="form-control" value="{{ ev.hora if ev.hora else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Curso <span class="text-danger">*</span></label>
                            <select name="curso_id" id="cursoInput" class="form-select" required>
                                {% for c in cursos %}
                                <option value="{{ c.id }}" {% if ev.curso_id == c.id %}selected{% endif %}>{{ c.nombre }} ({{ c.nivel }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Asignatura <span class="text-danger">*</span></label>
                            <select name="asignatura_id" class="form-select" required>
                                {% for a in asignaturas %}
                                <option value="{{ a.id }}" {% if ev.asignatura_id == a.id %}selected{% endif %}>{{ a.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Profesor</label>
                            <input type="text" class="form-control" value="{{ ev.profesor.nombre_completo }}" disabled>
                            <div class="form-text">No puedes reasignar la evaluación a otro profesor.</div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Descripción</label>
                            <textarea name="descripcion" class="form-control" rows="3">{{ ev.descripcion if ev.descripcion else '' }}</textarea>
                        </div>
                    </div>

                    <div id="disponibilidad" class="alert mt-3" style="display:none;"></div>

                    <hr>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="/evaluaciones/{{ ev.id }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary" id="btnSubmit">
                            <i class="bi bi-check-lg me-1"></i>Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const fechaInput = document.getElementById('fechaInput');
    const cursoInput = document.getElementById('cursoInput');
    const disponibilidad = document.getElementById('disponibilidad');
    const btnSubmit = document.getElementById('btnSubmit');
    const evalId = {{ ev.id }};

    async function checkDisponibilidad() {
        const fecha = fechaInput.value;
        const cursoId = cursoInput.value;
        if (!fecha || !cursoId) {
            disponibilidad.style.display = 'none';
            return;
        }
        try {
            const resp = await fetch('/evaluaciones/api/disponibilidad?curso_id=' + cursoId + '&fecha=' + fecha);
            const data = await resp.json();
            const otherEvals = data.evaluaciones ? data.evaluaciones.filter(e => e.id != evalId) : [];
            const otherCount = otherEvals.length;
            if (otherCount >= 2) {
                disponibilidad.className = 'alert alert-danger mt-3';
                disponibilidad.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i><strong>No hay lugar.</strong> Ya existen 2 evaluaciones para este curso en esta fecha.';
                disponibilidad.style.display = 'block';
                btnSubmit.disabled = true;
            } else {
                disponibilidad.className = 'alert alert-success mt-3';
                disponibilidad.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i><strong>Hay lugar disponible.</strong> ' + (2 - otherCount) + ' espacio(s) disponible(s).';
                disponibilidad.style.display = 'block';
                btnSubmit.disabled = false;
            }
        } catch(e) {
            disponibilidad.style.display = 'none';
        }
    }

    fechaInput.addEventListener('change', checkDisponibilidad);
    cursoInput.addEventListener('change', checkDisponibilidad);
});
</script>

{% endblock %}
