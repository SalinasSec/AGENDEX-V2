{% extends 'base.html' %}
{% block content %}


<div class="row g-4">
    <div class="col-lg-4">
        <div class="card">
            <div class="card-header">
                <h6 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Registrar Curso</h6>
            </div>
            <div class="card-body">
                <form method="POST" action="/admin/cursos">
                    <div class="mb-3">
                        <label class="form-label">Nombre <span class="text-danger">*</span></label>
                        <input type="text" name="nombre" class="form-control" required placeholder="Ej: 1° Medio A">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nivel <span class="text-danger">*</span></label>
                        <input type="text" name="nivel" class="form-control" required placeholder="Ej: Medio">
                    </div>
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check-lg me-1"></i>Guardar</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h6 class="mb-0"><i class="bi bi-building me-2"></i>Cursos Registrados ({{ data|length }})</h6>
            </div>
            <div class="card-body p-0">
                {% if data|length > 0 %}
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr><th>Nombre</th><th>Nivel</th><th class="text-end">Acciones</th></tr>
                        </thead>
                        <tbody>
                            {% for c in data %}
                            <tr>
                                <td class="fw-semibold">{{ c.nombre }}</td>
                                <td>{{ c.nivel }}</td>
                                <td class="text-end">
                                    <form method="POST" action="/admin/cursos/{{ c.id }}/eliminar" class="d-inline" onsubmit="return confirm('¿Eliminar el curso {{ c.nombre }}?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar"><i class="bi bi-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                {% else %}
                <p class="text-center text-muted py-4">Aún no hay cursos registrados.</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>



{% endblock %}
