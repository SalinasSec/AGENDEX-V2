{% extends 'base.html' %}
{% block content %}


<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0"><i class="bi bi-person-plus me-2"></i>Registrar Nuevo Alumno</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="/alumnos/crear">
                    <div class="mb-3">
                        <label class="form-label">RUT <span class="text-danger">*</span></label>
                        <input type="text" name="rut" class="form-control" placeholder="12.345.678-9" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre <span class="text-danger">*</span></label>
                        <input type="text" name="nombre" class="form-control" placeholder="Nombres" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Apellido <span class="text-danger">*</span></label>
                        <input type="text" name="apellido" class="form-control" placeholder="Apellidos" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Curso <span class="text-danger">*</span></label>
                        <select name="curso_id" class="form-select" required>
                            <option value="">Selecciona un curso...</option>
                            {% for c in cursos %}
                            <option value="{{ c.id }}">{{ c.nombre }} ({{ c.nivel }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="/alumnos" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Guardar Alumno</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>



{% endblock %}
