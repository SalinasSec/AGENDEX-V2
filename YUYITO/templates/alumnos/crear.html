{% extends "base.html" %}

{% block title %}Nuevo Alumno{% endblock %}

{% block breadcrumb %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="{{ url_for('dashboard.index') }}">Inicio</a></li>
        <li class="breadcrumb-item"><a href="{{ url_for('alumnos.listar') }}">Alumnos</a></li>
        <li class="breadcrumb-item active">Nuevo Alumno</li>
    </ol>
</nav>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0"><i class="bi bi-person-plus me-2"></i>Registrar Alumno</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">RUT <span class="text-danger">*</span></label>
                            <input type="text" name="rut" class="form-control" required placeholder="Ej: 20.123.456-1">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Nombre <span class="text-danger">*</span></label>
                            <input type="text" name="nombre" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Apellido <span class="text-danger">*</span></label>
                            <input type="text" name="apellido" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Curso <span class="text-danger">*</span></label>
                            <select name="curso_id" class="form-select" required>
                                <option value="">Seleccionar curso...</option>
                                {% for c in cursos %}
                                <option value="{{ c.id }}">{{ c.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('alumnos.listar') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success"><i class="bi bi-check-lg me-1"></i>Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
